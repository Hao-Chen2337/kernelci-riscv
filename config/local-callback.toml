# TEMPLATE, not the settings file used at runtime.
#
# kernelci loads settings with a plain toml.load() that does not expand
# environment variables, so a tracked file cannot refer to "the checkout next
# to me" - it would have to hardcode one machine's home directory, which made
# every clone silently read another deployment's YAML config and SSH key.
#
# scripts/render-local-config.py substitutes @KCI_ROOT@ with the repository
# root and writes the real settings file to work/local-callback.toml
# (gitignored); run-local-stack.sh does that automatically before starting.
#
# The default configuration is used for all the jobs that don't have a specific configuration
[DEFAULT]
api_config = "docker-host"
storage_config = "docker-host"
verbose = true
# The second directory is the RENDERED copy of config/cb-config (which is a
# template carrying the deployment's port placeholders): the tracked directory
# itself would give the callback a literal placeholder instead of a port.
yaml_config = ["@KCI_ROOT@/kernelci-pipeline/config", "@KCI_ROOT@/work/cb-config"]

[trigger]
# how often to poll git trees for new commits
poll_period = 0
# delay first git poll after startup
startup_delay = 3
# checkout default timeout
timeout = 180

[tarball]
# where to store git tree sources, relative to tarball process
kdir = "/home/kernelci/data/src/linux"
# where to store tarballs, relative to tarball process
output = "/home/kernelci/data/output"
# which storage service to use
storage_config = "docker-host"

[patchset]
kdir = "/home/kernelci/data/src/linux-patchset"
output = "/home/kernelci/data/output"
storage_config = "docker-host"
patchset_tmp_file_prefix = "kernel-patch"
patchset_short_hash_len = 13
# domains allowed to fetch patches from
allowed_domains = ["patchwork.kernel.org"]
polling_delay_secs = 30
# maximum size of a single downloaded patch (mbox) file
patchset_max_patch_size_mb = 10

[scheduler]
# directory to store temporary job templates
output = "/home/kernelci/data/output"

[notifier]

[send_kcidb]
origin = "maestro"

[test_report]

[cron]
upload_path = "kci-dev/report"
file_path = "/home/kernelci/logs/"
smtp_host = "smtp.gmail.com"
smtp_port = 587
email_sender = "bot@kernelci.org"
# Empty on purpose: this is a local dev instance and the addresses inherited
# from the upstream template belong to real people - a local stack must not be
# able to mail them by accident.
email_recipient = []
# email_password = <email-password>

[timeout]

[storage.docker-host]
storage_cred = "@KCI_ROOT@/kernelci-pipeline/data/ssh/id_rsa_tarball"

[storage.k8s-host]
storage_cred = "@KCI_ROOT@/kernelci-pipeline/data/ssh/id_rsa_tarball"

# JWT secret to generate Pipeline API tokens
#[jwt]
#secret = "SomeSecretString"

# Azure secret token to upload artifacts to Azure files storage
#[storage.staging-azure]
#storage_cred = "?sv=......"

#[runtime.lava-collabora]
# runtime_token is the token used to authenticate with the LAVA server
# callback_token is the token used by LAVA in callback data 
# in case callback_token is not set, runtime_token is expected to be used
#runtime_token = "REPLACE-LAVA-TOKEN-GENERATED-BY-LAB-LAVA-COLLABORA"
#callback_token = "REPLACE-LAVA-TOKEN-GENERATED-BY-LAB-LAVA-COLLABORA"

[runtime]
pull-labs-riscv = { runtime_token = "Token labtoken-runtime", callback_token = "Token labtoken-callback" }
