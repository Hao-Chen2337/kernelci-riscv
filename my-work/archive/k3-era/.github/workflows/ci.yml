name: kernelci-riscv

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # full test suite on self-hosted runner (K3 real hardware)
  board-test:
    runs-on: [ self-hosted, riscv64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Config drift check
        run: bash config-drift-check.sh

      - name: Run riscv selftests
        run: sudo bash run-tests.sh

      - name: Run KVM selftests
        run: sudo bash run-kvm-tests.sh

      - name: Upload trend table
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: kci/results/
